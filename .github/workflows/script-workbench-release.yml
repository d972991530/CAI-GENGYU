# 剧本结构台：改动推到 main 后自动打包签名、发布 GitHub Release，并更新下载页（GitHub Pages）。
# 首次使用前需要在仓库 Settings 里配置签名密钥 Secrets，并把 Pages 来源设为 GitHub Actions，见 script-workbench/README.md。
name: script-workbench release

on:
  push:
    branches: [main]
    paths:
      - "script-workbench/**"
      - ".github/workflows/script-workbench-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: script-workbench-release
  cancel-in-progress: false

env:
  SIGNER_URL: https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
  SIGNER_SHA256: e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version
        id: v
        working-directory: script-workbench
        run: |
          V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          if ! grep -q "VERSION = \"$V\"" www/js/update.js; then
            echo "::error::version.json ($V) 与 www/js/update.js 里的 VERSION 不一致"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少签名密钥：请在仓库 Settings → Secrets and variables → Actions 添加 KEYSTORE_BASE64 等 4 个 Secret"
            exit 1
          fi
          mkdir -p out
          python3 script-workbench/tools/repack.py script-workbench/android/base.apk script-workbench/www out/unsigned.apk
          curl -sSfL -o "$RUNNER_TEMP/signer.jar" "$SIGNER_URL"
          echo "$SIGNER_SHA256  $RUNNER_TEMP/signer.jar" | sha256sum -c -
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          java -jar "$RUNNER_TEMP/signer.jar" -a out/unsigned.apk -o out/signed \
            --ks "$RUNNER_TEMP/release.jks" --ksAlias "$KEY_ALIAS" --ksPass "$KEYSTORE_PASSWORD" --ksKeyPass "$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"
          mv out/signed/*-aligned-signed.apk "out/script-workbench-$V.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'EOF' > notes.md
          import json
          j = json.load(open("script-workbench/version.json"))
          print(j["notes"].get("zh-CN", ""))
          print()
          print(j["notes"].get("en", ""))
          EOF
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" "out/script-workbench-$V.apk" --clobber
          else
            gh release create "v$V" "out/script-workbench-$V.apk" --title "剧本结构台 v$V" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Assemble download page
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          cp -r script-workbench/site _site
          cp script-workbench/version.json _site/version.json
          mkdir -p _site/download
          cp "out/script-workbench-$V.apk" _site/download/script-workbench.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
