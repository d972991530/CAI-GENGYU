name: 分镜预览台安装包

on:
  push:
    branches: [main, ccr-d9d8d287-lhrfpc]
    paths:
      - "tools/storyboard-previewer/**"
      - "apps/storyboard-app/**"
      - ".github/workflows/storyboard-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 安装包 (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/storyboard-app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storyboard-app/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: StoryboardPreviewer-Windows
          path: apps/storyboard-app/dist/*.exe
          if-no-files-found: error

  android:
    name: 安卓安装包 (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storyboard-app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storyboard-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:prepare
      - name: 生成应用图标
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor "#0f1312" --splashBackgroundColor "#0f1312"
      - run: npx cap sync android
      - name: 编译 APK
        working-directory: apps/storyboard-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: 重命名
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StoryboardPreviewer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StoryboardPreviewer-Android
          path: apps/storyboard-app/StoryboardPreviewer-android.apk
          if-no-files-found: error
