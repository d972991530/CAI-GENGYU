name: Build 蛊变 (Windows + Android)

on:
  push:
    paths:
      - 'gubian-game/**'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: gubian-game

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gubian-game/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GuBian-Windows
          path: |
            gubian-game/release/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gubian-game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run validate
      - run: npm run android:init
      - name: Gradle assembleDebug
        working-directory: gubian-game/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GuBian-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GuBian-Android
          path: gubian-game/GuBian-Android.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-build-${{ github.run_number }}
          name: 蛊变：长江启示录 · 构建 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            《蛊变：长江启示录》Doom 风格第一人称恐怖射击 · 全八章

            - 手机版（安卓）：下载 `GuBian-Android.apk`，在手机上安装（需允许“安装未知来源应用”）。触屏操控界面。
            - 电脑版（Windows）：`GuBian Setup *.exe` 为安装版，`GuBian-Portable-*.exe` 为免安装版。键鼠 / 手柄操控界面。
          files: |
            out/*.apk
            out/*.exe
