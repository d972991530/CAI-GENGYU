name: Build 蛊变 (Windows + Mac + Android + Web)

on:
  push:
    paths:
      - 'gubian-game/**'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: gubian-game

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gubian-game/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GuBian-Windows
          path: |
            gubian-game/release/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gubian-game/package-lock.json
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GuBian-Mac
          path: gubian-game/release/*.dmg
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gubian-game/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r dist-desktop site/pc
          cp -r dist-mobile site/m
          cp web/index.html site/index.html
          touch site/.nojekyll
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gubian-game/site
          publish_branch: gh-pages
          force_orphan: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gubian-game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run validate
      - run: npm run android:init
      - name: Gradle assembleDebug
        working-directory: gubian-game/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GuBian-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GuBian-Android
          path: gubian-game/GuBian-Android.apk
          if-no-files-found: error

  release:
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-build-${{ github.run_number }}
          name: 蛊变：长江启示录 · 构建 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            《蛊变：长江启示录》Doom 风格第一人称恐怖射击 · 全八章

            - 手机版（安卓）：下载 `GuBian-Android.apk`，在手机上安装（需允许“安装未知来源应用”）。触屏操控界面。
            - 电脑版（Windows）：`GuBian Setup *.exe` 为安装版，`GuBian-Portable-*.exe` 为免安装版。键鼠 / 手柄操控界面。
            - 电脑版（Mac）：`GuBian-Mac-*.dmg`（Intel 与 Apple 芯片通用）。未经苹果签名，首次打开请右键 →「打开」；若提示“已损坏”，在终端执行 `xattr -cr /Applications/GuBian.app`。
            - 网页版（Mac / iPhone / iPad 免安装）：https://d972991530.github.io/CAI-GENGYU/ 。iPhone 用 Safari 打开后「分享 → 添加到主屏幕」即可全屏游玩。
          files: |
            out/*.apk
            out/*.exe
            out/*.dmg
